networks:
  app_network:
    external: true
    name: ${NETWORK_NAME}

volumes:
  otm_db:

services:
  app:
    image: ${IMAGE}
    container_name: otm-app
    labels:
      - "traefik.enable=true"
      # Marketing site (Hugo static). With SUBDOMAIN set the host is
      # <sub>.<top> (e.g. development.makerspace.olaru.dk); with SUBDOMAIN
      # empty it collapses to the apex (e.g. otownmakerspace.dk). The
      # ${SUBDOMAIN:+${SUBDOMAIN}.} form drops the slug *and* its dot when
      # SUBDOMAIN is empty, so there is no stray leading ".".
      - "traefik.http.routers.otm-app.rule=Host(`${SUBDOMAIN:+${SUBDOMAIN}.}${TOPDOMAIN}`)"
      - "traefik.http.routers.otm-app.entrypoints=websecure"
      - "traefik.http.routers.otm-app.tls.certresolver=myresolver"
      # Members (dashboard, auth flows, all dynamic): members.<host>
      # (members.development.makerspace.olaru.dk, or members.otownmakerspace.dk
      # when SUBDOMAIN is empty).
      - "traefik.http.routers.otm-members.rule=Host(`members.${SUBDOMAIN:+${SUBDOMAIN}.}${TOPDOMAIN}`)"
      - "traefik.http.routers.otm-members.entrypoints=websecure"
      - "traefik.http.routers.otm-members.tls.certresolver=myresolver"
      # www.<host> gets its own router and certificate so an ACME failure on
      # the www name (no DNS record on a preview subdomain) cannot take the
      # apex certificate down with it. Every www request is a permanent
      # redirect to the apex, so search engines see one canonical host.
      - "traefik.http.routers.otm-www.rule=Host(`www.${SUBDOMAIN:+${SUBDOMAIN}.}${TOPDOMAIN}`)"
      - "traefik.http.routers.otm-www.entrypoints=websecure"
      - "traefik.http.routers.otm-www.tls.certresolver=myresolver"
      - "traefik.http.routers.otm-www.middlewares=otm-www-to-apex"
      - "traefik.http.routers.otm-www.service=otm-app"
      - "traefik.http.middlewares.otm-www-to-apex.redirectregex.regex=^https?://www\\.(.+)"
      - "traefik.http.middlewares.otm-www-to-apex.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.otm-www-to-apex.redirectregex.permanent=true"
      # The Go file server sends every asset uncompressed; Traefik's compress
      # middleware gzips/brotlis HTML, CSS, JS and SVG on the way out.
      - "traefik.http.middlewares.otm-compress.compress=true"
      - "traefik.http.routers.otm-app.middlewares=otm-compress"
      - "traefik.http.routers.otm-members.middlewares=otm-compress"
      # Both routers send to the same backend service (single Go binary).
      - "traefik.http.services.otm-app.loadbalancer.server.port=4242"
      - "traefik.http.routers.otm-members.service=otm-app"
    environment:
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "4242"
      # Backend is reachable to users at the members subdomain. Stripe redirects,
      # password-reset email links, and Customer Portal returns all use this.
      BACKEND_PUBLIC_URL: "https://members.${SUBDOMAIN:+${SUBDOMAIN}.}${TOPDOMAIN}"
      # Apex / marketing host. Used for logout "back to site" redirects.
      MARKETING_BASE_URL: "https://${SUBDOMAIN:+${SUBDOMAIN}.}${TOPDOMAIN}"
      MEMBERS_HOST: "members.${SUBDOMAIN:+${SUBDOMAIN}.}${TOPDOMAIN}"
      STRIPE_PRICE_ID: "${STRIPE_PRICE_ID:-}"
      SITE_RELEASE: "${SITE_RELEASE:-}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-otm-session}"
      # SMTP host/port are deployment-specific; no defaults.
      # Username is bind-mounted as a secret (see volumes below).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      # Message identities (optional; both fall back to the smtp_username
      # secret). MAIL_FROM must be a registered "Send mail as" alias of the
      # Gmail account or Gmail silently rewrites it.
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_REPLY_TO: "${MAIL_REPLY_TO:-}"
      # Brand identity rendered into emails. Backend has sane defaults; only
      # set these to override per-deployment.
      BRAND_NAME: "${BRAND_NAME:-}"
      BRAND_WORDMARK_LEADING: "${BRAND_WORDMARK_LEADING:-}"
      BRAND_WORDMARK_ACCENT: "${BRAND_WORDMARK_ACCENT:-}"
      BRAND_LOGO_URL: "${BRAND_LOGO_URL:-}"
      # Google Contacts label that mirrors the active membership (mailing-list
      # sync). Backend default is "Makerspace Members"; override per deployment
      # so staging syncs into its own label, never the production one.
      GOOGLE_CONTACT_GROUP: "${GOOGLE_CONTACT_GROUP:-}"
    networks: [ app_network ]
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${SECRETS_FOLDER}/cookie_store_key
        target: /run/secrets/cookie_store_key
        read_only: true
      - type: bind
        source: ${SECRETS_FOLDER}/stripe_key
        target: /run/secrets/stripe_key
        read_only: true
      - type: bind
        source: ${SECRETS_FOLDER}/stripe_publishable_key
        target: /run/secrets/stripe_publishable_key
        read_only: true
      - type: bind
        source: ${SECRETS_FOLDER}/stripe_webhook_secret
        target: /run/secrets/stripe_webhook_secret
        read_only: true
      - type: bind
        source: ${SECRETS_FOLDER}/smtp_username
        target: /run/secrets/smtp_username
        read_only: true
      - type: bind
        source: ${SECRETS_FOLDER}/smtp_password
        target: /run/secrets/smtp_password
        read_only: true
      - type: bind
        source: ${SECRETS_FOLDER}/altcha_hmac_key
        target: /run/secrets/altcha_hmac_key
        read_only: true
      # Google Contacts mailing-list sync credentials. Files may be empty —
      # the backend then disables the sync — but must exist (a missing bind
      # source fails the mount). dev.sh and the deploy action both create them.
      - type: bind
        source: ${SECRETS_FOLDER}/google_client_id
        target: /run/secrets/google_client_id
        read_only: true
      - type: bind
        source: ${SECRETS_FOLDER}/google_client_secret
        target: /run/secrets/google_client_secret
        read_only: true
      - type: bind
        source: ${SECRETS_FOLDER}/google_refresh_token
        target: /run/secrets/google_refresh_token
        read_only: true
      - ../../db:/app/db

  db:
    image: postgres:15-alpine
    container_name: otm-db
    restart: unless-stopped
    environment:
      # Basic shared credentials — security comes from network isolation, not
      # secrecy (the DB is only on app_network + a loopback-only host port).
      POSTGRES_DB: otm
      POSTGRES_USER: otm
      POSTGRES_PASSWORD: otm
    volumes:
      - otm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otm -d otm"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    networks: [ app_network ]

  stripe-cli:
    image: stripe/stripe-cli
    entrypoint: /bin/sh
    command: -c 'stripe listen --forward-to http://otm-app:4242/webhook --api-key $$(cat /run/secrets/stripe_key)'
    container_name: otm-stripe-cli
    networks: [ app_network ]
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${SECRETS_FOLDER}/stripe_key
        target: /run/secrets/stripe_key
        read_only: true
    profiles:
      - dev

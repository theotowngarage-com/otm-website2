# ── What is a Makerspace ──
[what_is_a_makerspace]
other = "What is a Makerspace?"

[what_is_a_makerspace_desc]
other = "A makerspace is a community-operated workspace where people come together to build, tinker, and learn. Think of it as a shared workshop — but with industrial-grade tools, expert knowledge, and a culture of helping each other out."

[makerspace_shared_workshop]
other = "A Shared Workshop"

[makerspace_shared_workshop_desc]
other = "A makerspace is a physical space equipped with tools and machines that would be impractical to own at home. Members share the space and maintain it together, keeping costs low for everyone."

[makerspace_tools_for_all]
other = "Tools for Every Craft"

[makerspace_tools_for_all_desc]
other = "From 3D printers and laser cutters to woodworking benches and soldering stations — a makerspace gives you access to a wide range of equipment across many disciplines, all under one roof."

[makerspace_learn_and_create]
other = "Learn, Create, Repeat"

[makerspace_learn_and_create_desc]
other = "Whether you're a complete beginner or a seasoned maker, this is a place where you can pick up new skills, experiment freely, and turn your ideas into reality with your own hands — with people around who share the same passion for learning and making things."


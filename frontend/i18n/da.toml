[access_247_desc]
other = "Adgang døgnet rundt til makerspace-lokalerne, på dine egne vilkår."

[tools_equipment]
other = "Værktøj & udstyr"

[tools_equipment_desc]
other = "Et stort udvalg af værktøj og maskiner til alle dine projekter — fra 3D-printere til metalbearbejdningsudstyr."

[community]
other = "Fællesskab"

[community_desc]
other = "Bliv en del af et energisk fællesskab, hvor du kan lære, dele viden og samarbejde med andre."

[tldr_how_to_get_started]
other = "Sådan kommer du i gang"

[step_open_house]
other = "Besøg et Åbent Hus"

[step_open_house_desc]
other = "Kom forbi makerspacet under et af vores Åbent Hus-arrangementer — de er åbne for alle. Uden for Åbent Hus har kun medlemmer adgang til lokalerne."

[step_introduction]
other = "Få din introduktion"

[step_introduction_desc]
other = "Under dit besøg får du en orientering fra et bestyrelsesmedlem om sikkerhed, adgang og hvordan tingene fungerer i rummet."

[step_documents]
other = "Gennemgå dokumenterne"

[step_documents_desc]
other = "Gennemgå vedtægterne og medlemsvilkårene, så du ved hvad du kan forvente, og hvad der forventes af dig."

[step_sign_up]
other = "Tilmeld dig online"

[step_sign_up_desc]
other = "Når du er klar, registrer dig som medlem via vores onlineformular og få 24/7 adgang til rummet."

[our_sponsors]
other = "Vores sponsorer"

[sponsors_page_title]
other = "Sponsorer og partnere"

[sponsors_page_intro]
other = "O'Town Makerspace er et non-profit, fællesskabsdrevet værksted. Virksomhederne og organisationerne nedenfor hjælper med at holde lyset tændt, printerne kørende og dørene åbne for alle, der vil bygge noget."

[sponsors_visit]
other = "Besøg hjemmeside"

[sponsors_thank_you_title]
other = "Tak"

[sponsors_thank_you_desc]
other = "Hver donation af udstyr, penge, tid eller ekspertise hjælper os med at vokse. Vi er dybt taknemmelige for de virksomheder og personer, der støtter makerspacet og gør vores fælles værksted muligt."

[sponsors_become_title]
other = "Bliv sponsor"

[sponsors_become_desc]
other = "Som sponsor af O'Town Makerspace bliver dit brand synligt for et aktivt fællesskab af byggere, hackere og opfindere — og du finansierer direkte værktøj og workshops i Odense. Kontakt os, så vi kan tale om et samarbejde."

[sponsors_become_cta]
other = "Kontakt os"

[ready_to_build]
other = "Klar til at bygge noget?"

[ready_to_build_desc]
other = "Uanset om du prototyper din næste idé, reparerer noget der gik i stykker, eller bare har lyst til at bruge hænderne — værktøjet og rummet er her. Det eneste der mangler er dig."


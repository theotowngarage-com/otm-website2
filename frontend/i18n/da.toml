# ── What is a Makerspace ──
[what_is_a_makerspace]
other = "Hvad er et Makerspace?"

[what_is_a_makerspace_desc]
other = "Et makerspace er et fællesskabsdrevet værksted, hvor folk mødes for at bygge, eksperimentere og lære. Tænk på det som et fælles værksted — men med professionelt værktøj, ekspertviden og en kultur, hvor man hjælper hinanden."

[makerspace_shared_workshop]
other = "Et fælles værksted"

[makerspace_shared_workshop_desc]
other = "Et makerspace er et fysisk rum udstyret med værktøj og maskiner, som ville være upraktiske at eje derhjemme. Medlemmerne deler rummet og vedligeholder det sammen, så omkostningerne holdes lave for alle."

[makerspace_tools_for_all]
other = "Værktøj til alle håndværk"

[makerspace_tools_for_all_desc]
other = "Fra 3D-printere og laserskærere til træværkstedsbænke og loddestandere — et makerspace giver dig adgang til et bredt udvalg af udstyr på tværs af mange discipliner, alt under ét tag."

[makerspace_learn_and_create]
other = "Lær, skab, gentag"

[makerspace_learn_and_create_desc]
other = "Uanset om du er helt nybegynder eller erfaren maker, er det her et sted, hvor du kan lære nye færdigheder, eksperimentere frit og gøre dine idéer til virkelighed med dine egne hænder — med folk omkring dig der deler den samme passion for at lære og skabe ting."


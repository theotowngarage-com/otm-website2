baseURL = 'https://otownmakerspace.dk/'
# Hugo's default. It was 'docs' historically — a GitHub Pages convention from
# when Pages could only serve a branch root or /docs. This repo deploys Pages
# via actions/deploy-pages (see .github/workflows/hugo.yml), which uploads an
# artifact from any path, so that constraint no longer applies. 'docs' also
# collided with the real content section at /docs/, producing docs/docs/.
publishDir = 'public'
title = "O'Town Makerspace — Community Workshop in Odense"
theme = 'hugo-up-business-main'
defaultContentLanguage = 'en'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

# Brand logos are a single source of truth in frontend/branding/logos/ — the
# Hugo site, the Typst pipeline in marketing-materials/, and the campaign
# folder all read that one directory instead of keeping copies.
#
# The mount republishes it at the historic URL (/images/branding/logos/…) so
# nothing downstream changes: theme params, the favicon in baseof.html, and the
# Go backend all still resolve. The backend matters most — it inlines these
# SVGs off disk from the *published* output (BACKEND_STATIC_DIR=/app/public),
# and loadInlineSVG only logs on a miss, so a wrong target would silently strip
# logos from checkout and email rather than fail loudly.
#
# The `static -> static` entry re-declares Hugo's default mount, which adding a
# mount for this target would otherwise replace.
[module]
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'branding/logos'
    target = 'static/images/branding/logos'

[languages]
  [languages.en]
    languageCode = 'en'
    label = 'English'
    weight = 1
    [languages.en.params]
      description = "A community-driven makerspace in Odense with 24/7 access to 3D printers, laser cutters, CNC machines, electronics, and woodworking tools."
      copyright = "© 2026 O'Town Makerspace. All rights reserved."

  [languages.da]
    languageCode = 'da'
    label = 'Dansk'
    weight = 2
    title = "O'Town Makerspace — Fællesværksted i Odense"
    [languages.da.params]
      description = "Et fællesskabsdrevet værksted i Odense med 24/7 adgang til 3D-printere, laserskærere, CNC-maskiner, elektronik og træværksted."
      copyright = "© 2026 O'Town Makerspace. Alle rettigheder forbeholdes."

[params]
  siteName = "O'Town Makerspace"
  # Filesystem paths relative to the project root, NOT URLs — header.html and
  # footer.html inline these with readFile, which reads the real project
  # directory and ignores the module mount above. (The mount only affects what
  # Hugo publishes; readFile does not see through it.) The inlined lockups
  # still contain <image href="/images/branding/logos/…"> references, and those
  # ARE resolved as URLs by the browser — which the mount serves.
  logo = "branding/logos/horizontal-lockup-notagline.svg"
  logoDark = "branding/logos/wordmark-white-transparent.svg"
  logoVertical = "branding/logos/vertical-lockup.svg"
  location = ["Havnegade 57, 5000 Odense C, Denmark"]
  ogImage = "images/og-default.jpg"
  # Google Ads tag (gtag.js). Consent-gated via the Klaro "googleAds"
  # service in baseof.html. Moved here from the retired otg-website
  # (theotowngarage.com) when its traffic was redirected to otm.
  googleAdsID = "AW-17544583777"
  # Google Analytics 4 (gtag.js). Consent-gated via the Klaro
  # "googleAnalytics" service in baseof.html.
  googleAnalyticsID = "G-2QG0JVPCGE"
  # Member-portal links: relative paths only. Hugo never bakes absolute
  # URLs — cross-host routing (apex → members backend) is handled at
  # runtime by the Go server via BACKEND_PUBLIC_URL env var.
  memberPortalUrl = "/login/"
  memberSignupUrl = "/checkout/"

  # ── Mail addresses: single source of truth ──
  # NOTHING else in the frontend may hardcode an address. Templates read these
  # params; layouts that need an encoded form (URL-escaped, base64) derive it
  # with `urlquery` / `base64Encode` rather than storing a second copy. Both
  # keys are load-bearing: footer.html, contact.html and events.html abort the
  # build via `errorf` if either is empty, so a typo fails loudly instead of
  # rendering a page with a missing contact link.
  #
  # The Go backend does NOT read this file — its outbound mail identity comes
  # from the MAIL_FROM / MAIL_REPLY_TO env vars (see api/README.md). Keep
  # `contact` below in sync with MAIL_REPLY_TO; they are the same human inbox.
  #
  # This table must stay BELOW every bare key in [params]: in TOML, keys after
  # a table header belong to that table, so moving it up would silently swallow
  # siteName, logo, location, … into params.email.
  [params.email]
    # Public inbox. Every mailto: link on the site resolves to this.
    contact = "info@otownmakerspace.dk"

    # Google account that owns the public events calendar — a *calendar ID* we
    # read from, not a mailbox we send to. events.html derives all three Google
    # URLs from this one value (embed src, .ics download, "add to Google
    # Calendar" cid); it is the same address as `contact` today, but keep it a
    # separate key so moving the calendar never forces a mailto: change.
    #
    # This replaces the retired info@theotowngarage.com calendar, which now
    # 404s — the events page had been embedding a calendar that no longer
    # exists. Verify with:
    #   curl -sIL https://calendar.google.com/calendar/ical/info%40otownmakerspace.dk/public/basic.ics
    calendar = "info@otownmakerspace.dk"

  [[params.sponsor_items]]
    name = "Coalescent Mobile Robotics"
    logo = "images/partners/Coalescent-Mobile-Robotics.webp"
    url = "https://cm-robotics.com"

  [[params.sponsor_items]]
